schema_version: 1
deck:
  id: retrieval-study-summary
  title: Retrieval study summary
  operation: create
  audience: Applied research team
  objective: Explain the study and its practical implications.
  language: en
  targets: [google_slides]
profiles:
  narrative: research-summary
narrative:
  thesis: Adaptive retrieval improves answer quality under a fixed context budget.
  chapters:
    - id: study
      title: Study
      purpose: Summarize the research from question through implications.
      core_message: Adaptive retrieval helps, but the dataset limits generalization.
sources:
  study-paper:
    title: Adaptive retrieval under fixed context budgets
    locator: https://example.com/retrieval-paper
    type: paper
claims:
  measured-quality:
    statement: Adaptive retrieval improves the selected quality score by five points.
    classes: [fact, quantitative]
    source_ids: [study-paper]
    measurement:
      metric: selected quality score
      unit: points
      conditions:
        - Fixed context budget
        - Published evaluation split
slides:
  order: [question, method, results, limitations, implications]
  items:
    question:
      title: Can retrieval adapt within a fixed context budget?
      purpose: State the research question.
      takeaway: The study tests whether selective retrieval improves useful context.
      narrative_roles: [question]
      status: approved
      locked: true
    method:
      title: The method allocates retrieval by estimated value
      purpose: Explain the method.
      takeaway: Retrieval depth changes with the expected value of additional evidence.
      narrative_roles: [method]
      status: approved
      locked: true
    results:
      title: Adaptive retrieval improves the selected quality score
      purpose: Present the result.
      takeaway: Selective retrieval outperforms a fixed policy in the reported setting.
      narrative_roles: [results]
      claim_ids: [measured-quality]
      status: approved
      locked: true
    limitations:
      title: Dataset breadth limits generalization
      purpose: State the study limitations.
      takeaway: The reported result may not transfer to unrelated domains.
      narrative_roles: [limitations]
      status: approved
      locked: true
    implications:
      title: Use adaptive retrieval where evidence value varies
      purpose: Explain practical implications.
      takeaway: Variable evidence value is the strongest candidate for deployment.
      narrative_roles: [implications]
      status: approved
      locked: true
