schema_version: 1
deck:
  id: incomplete-strategy
  title: Incomplete strategy
  operation: create
  audience: Leadership
  objective: Explain a strategy.
  language: en
  targets: [pptx]
profiles:
  narrative: executive-strategy
narrative:
  thesis: The organization should adopt a shared platform.
  chapters:
    - id: strategy
      title: Strategy
      purpose: Present the strategy.
      core_message: A platform improves reuse.
slides:
  order: [context, thesis, program, roadmap, outcome]
  items:
    context:
      title: Repeated work is increasing
      purpose: Explain why change is timely.
      takeaway: Current delivery duplicates effort.
      narrative_roles: [why-now]
      status: approved
      locked: true
    thesis:
      title: Shift from projects to a platform
      purpose: Explain what changes.
      takeaway: Common services should replace repeated integration.
      narrative_roles: [what-changes]
      status: approved
      locked: true
    program:
      title: Build reusable services
      purpose: Explain what to build.
      takeaway: Common services become reusable primitives.
      narrative_roles: [what-to-build]
      status: approved
      locked: true
    roadmap:
      title: Deliver in stages
      purpose: Explain when.
      takeaway: Stage gates manage risk.
      narrative_roles: [when]
      status: approved
      locked: true
    outcome:
      title: Align on the direction
      purpose: State the desired outcome.
      takeaway: Leadership aligns on the platform direction.
      narrative_roles: [outcome]
      status: approved
      locked: true
