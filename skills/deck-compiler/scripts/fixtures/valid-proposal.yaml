schema_version: 1
deck:
  id: onboarding-automation-proposal
  title: Onboarding automation proposal
  operation: create
  audience: Operations leadership
  objective: Decide whether to fund the first automation stage.
  language: en
  targets: [pptx]
profiles:
  narrative: proposal
narrative:
  thesis: Automating repeated onboarding checks can reduce avoidable manual work.
  chapters:
    - id: proposal
      title: Proposal
      purpose: Present the problem, solution, value, plan, and ask.
      core_message: A staged automation project can deliver value with controlled risk.
slides:
  order: [problem, solution, value, plan, ask]
  items:
    problem:
      title: Manual onboarding repeats the same checks
      purpose: Define the problem.
      takeaway: Repeated checks consume time and create inconsistent execution.
      narrative_roles: [problem]
      status: approved
      locked: true
    solution:
      title: Automate deterministic checks and route exceptions
      purpose: Explain the solution.
      takeaway: Automation handles repeatable checks while people resolve exceptions.
      narrative_roles: [solution]
      status: approved
      locked: true
    value:
      title: Faster onboarding creates reusable operating leverage
      purpose: Explain the expected value.
      takeaway: The same automation supports each future onboarding cycle.
      narrative_roles: [value]
      status: approved
      locked: true
    plan:
      title: Start with one workflow and explicit stage gates
      purpose: Present the implementation plan.
      takeaway: A bounded first stage tests value before wider rollout.
      narrative_roles: [plan]
      status: approved
      locked: true
    ask:
      title: Approve the first workflow and review gates
      purpose: State the requested decision.
      takeaway: Fund one workflow and expand only after acceptance.
      narrative_roles: [ask]
      status: approved
      locked: true
